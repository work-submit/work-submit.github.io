<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">FS-DVS project card</title>
  <desc id="desc">A bright scientific cover graphic for FS-DVS showing center-surround sensing, event streams, CSF alignment, and sensor-in-the-loop validation.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1600" y2="900" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffffff"/>
      <stop offset="0.52" stop-color="#f7fbfd"/>
      <stop offset="1" stop-color="#fff7f2"/>
    </linearGradient>
    <linearGradient id="blue-red" x1="350" y1="240" x2="1030" y2="660" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1867d5"/>
      <stop offset="0.5" stop-color="#eef8fb"/>
      <stop offset="1" stop-color="#ef3347"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="22" flood-color="#17304f" flood-opacity="0.14"/>
    </filter>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <path d="M1110 79c165 50 280 171 326 325 49 164-13 298-149 364-154 74-352 35-462-78-111-114-99-276 27-399 72-70 156-127 258-212Z" fill="#eaf6fb"/>
  <path d="M86 710c88-116 221-150 364-123 132 25 238 104 278 205H86Z" fill="#fff0ea"/>

  <g transform="translate(112 96)">
    <image href="fs_dvs_logo.svg" x="0" y="0" width="390" height="92"/>
    <text x="0" y="173" fill="#13233a" font-family="Avenir Next, Helvetica Neue, Arial, sans-serif" font-size="54" font-weight="800">Frequency-selective</text>
    <text x="0" y="233" fill="#13233a" font-family="Avenir Next, Helvetica Neue, Arial, sans-serif" font-size="54" font-weight="800">event sensing</text>
    <text x="2" y="293" fill="#51687b" font-family="Avenir Next, Helvetica Neue, Arial, sans-serif" font-size="25" font-weight="500">Learning a center-surround spatial filter before DVS triggering</text>
    <text x="2" y="329" fill="#51687b" font-family="Avenir Next, Helvetica Neue, Arial, sans-serif" font-size="25" font-weight="500">to recover weak structures while preserving noise resilience.</text>
  </g>

  <g transform="translate(130 515)">
    <rect x="0" y="0" width="268" height="106" rx="8" fill="#ffffff" stroke="#d8e4ec"/>
    <text x="24" y="43" fill="#ef3347" font-family="Avenir Next, Helvetica Neue, Arial, sans-serif" font-size="26" font-weight="800">+12.3 mAP</text>
    <text x="24" y="76" fill="#5b7183" font-family="Avenir Next, Helvetica Neue, Arial, sans-serif" font-size="20">object detection</text>
    <rect x="294" y="0" width="268" height="106" rx="8" fill="#ffffff" stroke="#d8e4ec"/>
    <text x="318" y="43" fill="#0b64c0" font-family="Avenir Next, Helvetica Neue, Arial, sans-serif" font-size="26" font-weight="800">CSF-like</text>
    <text x="318" y="76" fill="#5b7183" font-family="Avenir Next, Helvetica Neue, Arial, sans-serif" font-size="20">mid-frequency prior</text>
  </g>

  <g transform="translate(675 154)" filter="url(#shadow)">
    <rect x="0" y="0" width="770" height="576" rx="28" fill="#ffffff" stroke="#d6e4ef"/>
    <g transform="translate(58 60)">
      <text x="0" y="0" fill="#16304b" font-family="Avenir Next, Helvetica Neue, Arial, sans-serif" font-size="27" font-weight="800">Center-surround sensing kernel</text>
      <g transform="translate(0 56)">
        <rect x="0" y="0" width="252" height="252" rx="18" fill="#f3f8fc" stroke="#ccdae6"/>
        <g transform="translate(45 45)">
          <rect x="0" y="0" width="48" height="48" rx="8" fill="#dfe9fb"/>
          <rect x="56" y="0" width="48" height="48" rx="8" fill="#ffe8e4"/>
          <rect x="112" y="0" width="48" height="48" rx="8" fill="#dce8fb"/>
          <rect x="0" y="56" width="48" height="48" rx="8" fill="#ffede9"/>
          <rect x="56" y="56" width="48" height="48" rx="8" fill="#ef3347"/>
          <rect x="112" y="56" width="48" height="48" rx="8" fill="#edf3fb"/>
          <rect x="0" y="112" width="48" height="48" rx="8" fill="#dce8fb"/>
          <rect x="56" y="112" width="48" height="48" rx="8" fill="#fff5f2"/>
          <rect x="112" y="112" width="48" height="48" rx="8" fill="#dce8fb"/>
        </g>
      </g>
      <g transform="translate(326 50)">
        <path d="M0 232C55 229 69 89 122 86c53-4 62 143 124 143 67 0 73-184 147-184" fill="none" stroke="#d9e4ed" stroke-width="12" stroke-linecap="round"/>
        <path d="M0 232C55 229 69 89 122 86c53-4 62 143 124 143 67 0 73-184 147-184" fill="none" stroke="url(#blue-red)" stroke-width="7" stroke-linecap="round"/>
        <path d="M0 272h405" stroke="#d7e1e8" stroke-width="2"/>
        <path d="M1 30v242" stroke="#d7e1e8" stroke-width="2"/>
        <text x="0" y="315" fill="#5b7183" font-family="Avenir Next, Helvetica Neue, Arial, sans-serif" font-size="20">spatial frequency</text>
        <text x="205" y="22" fill="#59785d" font-family="Avenir Next, Helvetica Neue, Arial, sans-serif" font-size="21" font-weight="700">human CSF aligned</text>
      </g>
      <g transform="translate(0 365)">
        <rect x="0" y="0" width="654" height="86" rx="12" fill="#f8fbfd" stroke="#dce8ef"/>
        <path d="M35 45h88M138 45h88M242 45h88M346 45h88M450 45h88M554 45h62" fill="none" stroke="#b4c4d0" stroke-width="4" stroke-linecap="round"/>
        <path d="M64 24v42M101 28v58M161 23v43M196 29v58M278 25v42M315 28v59M392 23v44M429 29v58M492 24v43M529 28v59" stroke="#ef3347" stroke-width="5" stroke-linecap="round"/>
        <path d="M82 60v42M122 58v54M178 59v42M219 58v54M296 59v42M337 58v54M410 60v42M451 58v54M510 59v42M552 58v54" stroke="#0b64c0" stroke-width="5" stroke-linecap="round"/>
      </g>
    </g>
  </g>
</svg>
