<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="OpticAI Lab Xiaoyun Yuan SJTU.">
  <title>OpticAI Lab | Xiaoyun Yuan | SJTU</title>

  <link rel="icon" type="image/png" href="./static/images/OpticAI_s.png" sizes="32x32">
  <link rel="stylesheet" href="./static/css/bulma.min.css">
  <link rel="stylesheet" href="./static/css/bulma-carousel.min.css">
  <link rel="stylesheet" href="./static/css/bulma-slider.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/jpswalsh/academicons@1/css/academicons.min.css">
  <link rel="stylesheet" href="./static/css/index.css">
  <link rel="stylesheet" href="./static/css/project-pages.css">

  <script type="text/javascript" async src="https://cdnjs.cloudflare.com/ajax/libs/mathjax/2.7.5/MathJax.js?config=TeX-AMS_HTML"></script>
  <script defer src="./static/js/fontawesome.all.min.js"></script>
</head>
<body>
  <nav class="site-nav" role="navigation" aria-label="main navigation">
    <div class="nav-inner">
      <a class="brand" href="./index.html" aria-label="OpticAI Lab home">
        <img src="./static/images/OpticAI.png" alt="OpticAI Lab">
        <span>OpticAI Lab</span>
      </a>

      <button class="nav-toggle" type="button" aria-label="Toggle navigation" aria-expanded="false">
        <span></span>
        <span></span>
        <span></span>
      </button>

      <div class="nav-links" id="nav-links">
        <!-- <a class="nav-link" href="./index.html">Projects</a> -->
        <a class="nav-link" href="https://pi.xiaoyunyuan.net/">PI</a>
        <a class="nav-link" data-target="team" href="./index.html?project=team">Members</a>
        <a class="nav-link" href="./index.html#intelligent-imaging">Intelligent Imaging</a>
        <a class="nav-link" href="./index.html#ai-vision">Generative AI</a>
        <a class="nav-link" href="./index.html#ai-optics">Optics + AI</a>
        <a class="nav-link" href="./index.html#datasets">Datasets</a>
        <a class="nav-link" href="./index.html#resources">Resources</a>
        <a class="nav-link" data-target="about" href="./index.html?project=about">News & Openings</a>
      </div>
    </div>
  </nav>

  <main id="content-container" aria-live="polite">
    <div class="loading">
      <i class="fas fa-spinner fa-spin fa-2x"></i>
      <p>Loading content...</p>
    </div>
  </main>

  <footer class="site-footer">
    <div class="footer-inner">
      <div>
        <strong>OpticAI Lab</strong>
        <p>The lab page of Dr. Xiaoyun Yuan at Shanghai Jiao Tong University</p>
      </div>
      <div class="footer-links">
        <a href="https://pi.xiaoyunyuan.net/" target="_blank" rel="noopener noreferrer">Homepage</a>
        <a href="mailto:yuanxiaoyun@sjtu.edu.cn">Email</a>
      </div>
    </div>
    <p class="template-credit">Built on GitHub Pages.</p>
  </footer>

  <script src="projects.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      const contentContainer = document.getElementById('content-container');
      const navLinks = document.querySelectorAll('.nav-link[data-target]');
      const navToggle = document.querySelector('.nav-toggle');
      const navMenu = document.getElementById('nav-links');

      function getProjectFromUrl() {
        return new URLSearchParams(window.location.search).get('project');
      }

      function setActive(target) {
        navLinks.forEach(function(link) {
          link.classList.toggle('is-active', link.getAttribute('data-target') === target);
        });
      }

      function closeMobileNav() {
        navToggle.classList.remove('is-active');
        navToggle.setAttribute('aria-expanded', 'false');
        navMenu.classList.remove('is-open');
      }

      function linkMarkup(link) {
        const external = link.href.startsWith('http');
        return `
          <a class="project-link" href="${link.href}" ${external ? 'target="_blank" rel="noopener noreferrer"' : ''}>
            <i class="${link.icon}" aria-hidden="true"></i>
            <span>${link.label}</span>
          </a>
        `;
      }

      function projectCard(project) {
        return `
          <article class="project-card">
            <a class="project-image" aria-label="Open ${project.title}">
              <img src="${project.image}" alt="${project.title} preview">
            </a>
            <div class="project-content">
              <div class="project-meta">
                <span>${project.directionLabel}</span>
                <span>${project.status}</span>
              </div>
              <h3><a>${project.title}</a></h3>
              <p class="project-title">${project.fullTitle}</p>
              <p>${project.summary}</p>
              <div class="tag-list">
                ${project.tags.map(function(tag) { return `<span>${tag}</span>`; }).join('')}
              </div>
              <div class="project-actions">
                ${project.links.map(linkMarkup).join('')}
              </div>
            </div>
          </article>
        `;
      }

      function applyProjectImageMode(image) {
        var projectImage = image.closest('.project-image');
        if (!projectImage || !image.naturalWidth || !image.naturalHeight) {
          return;
        }

        var ratio = image.naturalWidth / image.naturalHeight;
        projectImage.classList.remove('project-image--portrait', 'project-image--landscape', 'project-image--ultra-landscape');

        if (ratio > 1.9) {
          projectImage.classList.add('project-image--ultra-landscape');
        } else if (ratio > 1.35) {
          projectImage.classList.add('project-image--landscape');
        } else {
          projectImage.classList.add('project-image--portrait');
        }
      }

      function markProjectImages() {
        var cardImages = document.querySelectorAll('.project-image img');
        cardImages.forEach(function(image) {
          if (image.naturalWidth && image.naturalHeight) {
            applyProjectImageMode(image);
            return;
          }

          image.addEventListener('load', function() {
            applyProjectImageMode(image);
          }, { once: true });
        });
      }

      function renderHome() {
        setActive('home');
        const directionSections = directions.map(function(direction) {
          const directionProjects = projects.filter(function(project) {
            return project.direction === direction.id;
          });

          return `
            <section class="research-section" id="${direction.id}">
              <div class="section-heading">
                <div>
                  <p class="eyebrow">${direction.kicker}</p>
                  <h2>${direction.title}</h2>
                </div>
                <p>${direction.description}</p>
              </div>
              <div class="project-grid">
                ${directionProjects.map(projectCard).join('')}
              </div>
            </section>
          `;
        }).join('');

        contentContainer.innerHTML = `
          <section class="lab-hero">
            <div class="hero-copy">
              <p class="eyebrow">MoE Key Lab of Artificial Intelligence, AI Institute, Shanghai Jiao Tong University</p>
              <h1>OpticAI Lab</h1>
              <p class="hero-lede">
                <b> Reprogramming light. Computing the invisible. </b> Decoding multidimensional dynamics through AI-native imaging architectures that transcend the limits of traditional optics. This hub hosts our latest algorithms, datasets, and reproducible codebases.
              </p>
              <div class="hero-actions">
                <a class="button-primary" href="#intelligent-imaging">
                  <i class="fas fa-layer-group" aria-hidden="true"></i>
                  <span>Explore Projects</span>
                </a>
                <a class="button-secondary" href="https://pi.xiaoyunyuan.net/" target="_blank" rel="noopener noreferrer">
                  <i class="fas fa-user-graduate" aria-hidden="true"></i>
                  <span>Homepage - Xiaoyun Yuan</span>
                </a>
                <a class="button-secondary" href="https://xiaoyunyuan.net/index.html?project=about" target="_blank" rel="noopener noreferrer">
                  <i class="far fa-newspaper" aria-hidden="true"></i>
                  <span>News & Openings</span>
                </a>
              </div>
            </div>
            <div class="hero-visual" aria-label="AI and optics visual">
              <img src="./static/images/ai_plus_optics.jpg" alt="AI optics helix illustration">
            </div>
          </section>

          ${directionSections}
        `;

        markProjectImages();

        if (window.location.hash) {
          const targetSection = document.querySelector(window.location.hash);
          if (targetSection) {
            requestAnimationFrame(function() {
              targetSection.scrollIntoView({ behavior: 'smooth', block: 'start' });
            });
          }
        }
      }

      function loadContent(target) {
        const filePath = contentPaths[target];

        if (!filePath) {
          renderHome();
          return;
        }

        setActive(target === 'about' ? 'about' : '');
        contentContainer.innerHTML = `
          <div class="loading">
            <i class="fas fa-spinner fa-spin fa-2x"></i>
            <p>Loading ${target}...</p>
          </div>
        `;

        fetch(filePath)
          .then(function(response) {
            if (!response.ok) {
              throw new Error('Failed to load ' + filePath);
            }
            return response.text();
          })
          .then(function(html) {
            contentContainer.innerHTML = `<div class="project-detail">${html}</div>`;

            if (window.MathJax) {
              MathJax.Hub.Queue(['Typeset', MathJax.Hub]);
            }
          })
          .catch(function(error) {
            console.error(error);
            contentContainer.innerHTML = `
              <section class="empty-state">
                <i class="fas fa-exclamation-triangle" aria-hidden="true"></i>
                <h1>Content could not be loaded</h1>
                <p>Please run this site through a local server or GitHub Pages so project files can be fetched correctly.</p>
                <code>${filePath}</code>
              </section>
            `;
          });
      }

      navToggle.addEventListener('click', function() {
        const isOpen = navMenu.classList.toggle('is-open');
        navToggle.classList.toggle('is-active', isOpen);
        navToggle.setAttribute('aria-expanded', isOpen ? 'true' : 'false');
      });

      document.querySelectorAll('.nav-links a').forEach(function(link) {
        link.addEventListener('click', closeMobileNav);
      });

      const target = getProjectFromUrl();
      if (target) {
        loadContent(target);
      } else {
        renderHome();
      }
    });
  </script>
</body>
</html>
